name: Build and test
on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.x

      - name: Build
        run: dotnet build Sagant.slnx --no-incremental

      - name: Test
        run: dotnet test Sagant.slnx -c Release --logger:"trx;LogFilePrefix=testResults"

      - name: Pack (verifies every packable project packs clean)
        shell: bash
        run: |
          shopt -s globstar nullglob
          mkdir -p .artifacts

          for project in src/**/*.csproj; do
            if grep -Eq '<IsPackable>\s*false\s*</IsPackable>' "$project"; then
              continue
            fi

            echo "Packing: $project"
            dotnet pack "$project" --no-build -c Release -o .artifacts -p:PackageVersion=0.0.0-ci
          done

      - name: Upload Test Result Files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/**/TestResults/**/*
          retention-days: 5
